    // Robust Safe Fetch Wrapper with CORS Proxy Fallback for Vercel/VPN bypass
    async function safeFetch(url, options = {}) {
        try {
            let res = await fetch(url, options);
            if (res && res.ok) {
                let json = await res.json();
                return json;
            }
        } catch (e) {}

        // Fallback via CORS proxy
        let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
        let resProxy = await fetch(proxyUrl, options);
        let text = await resProxy.text();
        try {
            return JSON.parse(text);
        } catch(err) {
            return text;
        }
    }

        let progressKey = 'video_progress_' + encodeURIComponent(videoUrl);
        let savedTime = parseFloat(localStorage.getItem(progressKey) || 0);

        videoElem.addEventListener('loadedmetadata', function() {
            if (savedTime > 2 && savedTime < videoElem.duration - 3) {
                videoElem.currentTime = savedTime;

        });

        videoElem.addEventListener('timeupdate', function() {
            if (videoElem.currentTime > 2) {
                localStorage.setItem(progressKey, videoElem.currentTime);

                        xhr.withCredentials = false;

                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();

                                    <div style="position:relative; width:100%; aspect-ratio:16/9; background:#000;">
                                        <iframe src="${videoUrl}" style="width:100%; height:100%; border:none;" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>

    function renderLiveClassCard(cls) {
        const status = getLiveStatus(cls);
        const hasRec = cls.mp4Recordings && cls.mp4Recordings.length > 0;
        
        const badge = status === 'LIVE'
            ? '<span class="badge badge-live"><span class="dot"></span>LIVE</span>'
            : status === 'Upcoming'
            ? '<span class="badge badge-upcoming">Upcoming</span>'
            : '<span class="badge badge-completed">Completed</span>';

        let actionBtn = '';
        if (status === 'LIVE' && (cls.class_link || cls.streamUrl || cls.url)) {
            let lUrl = cls.class_link || cls.streamUrl || cls.url;
            actionBtn = `<button class="btn" style="width:100%; margin-top:10px; background:#ff3b30; color:#fff; justify-content:center; text-align:center;" onclick="playInAppVideo('${esc(lUrl)}', '${esc(cls.title)}')"><i class="fa-solid fa-play"></i> Join Live</button>`;

            actionBtn = `<button class="btn" style="width:100%;margin-top:10px;background:#6c757d;" disabled>⏳ Upcoming</button>`;

        return `
        <div class="class-card">
            <div class="class-card-head">
                <div style="flex:1;min-width:0;">
                    <div class="class-title">${esc(cls.title)}</div>

        if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
        document.body.style.filter = 'blur(20px)'; 
    });

    window.addEventListener('focus', function () { 
        document.body.style.filter = 'none'; 
    });

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) { 
            document.body.style.filter = 'blur(20px)'; 
        } else {

    function toggle(id) {
        var e = document.getElementById(id);
        if(e) { e.style.display = (e.style.display === "block") ? "none" : "block"; }

    function setActiveTab(tab) {
        document.getElementById('btn-home').classList.remove('active');
        document.getElementById('btn-live').classList.remove('active');
        if(document.getElementById('btn-recorded')) document.getElementById('btn-recorded').classList.remove('active');
        document.getElementById('btn-fav').classList.remove('active');
        if(tab === 'home') document.getElementById('btn-home').classList.add('active');
        if(tab === 'live') document.getElementById('btn-live').classList.add('active');
        if(tab === 'recorded' && document.getElementById('btn-recorded')) document.getElementById('btn-recorded').classList.add('active');
        if(tab === 'fav') document.getElementById('btn-fav').classList.add('active');
    }

    function isBatchRecorded(b) {
        let searchString = ((b.title || b.name || "") + " " + (b.description || b.about || "")).toLowerCase();
        return searchString.includes("vod") || searchString.includes("vdo") || searchString.includes("video") || searchString.includes("recorded") || searchString.includes("rec");
    }

    function getLiveBatches() { return allFetchedBatches.filter(b => !isBatchRecorded(b)); }
    function getRecordedBatches() {
        return allFetchedBatches.filter(b => {
            let searchString = ((b.title || b.name || "") + " " + (b.description || b.about || "")).toLowerCase();
            return isBatchRecorded(b) || searchString.includes("reasoning special") || (!searchString.includes("live") && b.isLive !== true);
        });
    }

    function filterBatches() {
        let query = document.getElementById('search-box').value.toLowerCase().trim();
        let targetList = [];

        if(document.getElementById('btn-fav').classList.contains('active')) { targetList = getFavorites(); } 
        else if(document.getElementById('btn-live').classList.contains('active')) { targetList = getLiveBatches(); } 
        else if(document.getElementById('btn-recorded') && document.getElementById('btn-recorded').classList.contains('active')) { targetList = getRecordedBatches(); } 
        else { targetList = allFetchedBatches; }

        let filtered = targetList.filter(b => {
            let title = (b.title || b.name || "").toLowerCase();
            return title.includes(query);
        });

        let isHomeTab = document.getElementById('btn-home').classList.contains('active');
        let isLiveTab = document.getElementById('btn-live').classList.contains('active');
        renderBatchesGrid(filtered, isHomeTab || isLiveTab);
    }

    function renderBatchesGrid(batches, checkTop24Global = false) {

                    mediaElement = `<video src="${banner.url}" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover; background:#000;"></video>`;

                let btnHtml = (banner.link && banner.btnText) ? `<a href="${banner.link}" target="_blank" style="margin-left: 12px; background: #28a745; color: white; padding: 6px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; border: 1px solid #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.4); display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;">${banner.btnText} <i class="fa-solid fa-arrow-right" style="font-size:11px;"></i></a>` : '';
                
                return `<div class="swiper-slide" style="background:#111; border-radius:10px; overflow:hidden; position:relative;">

                    <div style="position:absolute; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.75); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 15px; z-index:10;">

            }).join('');

            html += `

            return;
        }

        html += '<div class="batch-grid">';
        
        batches.forEach((b) => {

            let realPriceNum = (b.originalPrice !== undefined && b.originalPrice !== null) ? Number(b.originalPrice) : ((b.price && b.discountPrice && Number(b.price) > Number(b.discountPrice)) ? Number(b.price) : sellPriceNum);

            let discountPercentage = 0;
            if (realPriceNum > 0 && sellPriceNum < realPriceNum) {
                discountPercentage = Math.round(((realPriceNum - sellPriceNum) / realPriceNum) * 100);
            }

            let priceDisplayHtml = '';
            if (sellPriceNum === 0) {
                priceDisplayHtml = `
                    <div class="price-row">
                        <span class="free-price">FREE</span>
                        ${realPriceNum > 0 ? `<span class="old-price">₹${realPriceNum}</span>` : ''}
                    </div>
                `;
            } else {
                priceDisplayHtml = `
                    <div class="price-row">
                        <span class="free-price">₹${sellPriceNum}</span>
                        ${realPriceNum > sellPriceNum ? `<span class="old-price">₹${realPriceNum}</span>` : ''}

            }
            if (discountPercentage > 0) {
                priceDisplayHtml += `<span class="price-discount-badge">${discountPercentage}% OFF</span>`;
            }

            let metaTagsHtml = '<div class="course-meta-tags">';
            if (b.isLive) {
                metaTagsHtml += `<span class="meta-tag" style="color:#ff3b30;"><i class="fa-solid fa-tower-broadcast"></i> Live</span>`;

                metaTagsHtml += `<span class="meta-tag"><i class="fa-solid fa-video"></i> Recorded</span>`;
            }
            if (b.validity) {
                let vStr = String(b.validity).trim();
                if (!vStr.toLowerCase().includes('validity')) {
                    if (vStr.match(/^\d+\s*(year|yr|month|mo|day|d)$/i)) {
                        vStr += " validity";
                    }
                }
                metaTagsHtml += `<span class="meta-tag"><i class="fa-regular fa-clock"></i> ${esc(vStr)}</span>`;
            }
            metaTagsHtml += '</div>';

            let isFav = favs.some(f => (f.id || f._id) === id);
            let bJsonStr = encodeURIComponent(JSON.stringify(b));

            let globalIndex = allFetchedBatches.findIndex(item => (item.id || item._id) === id);
            let showLiveBadge = checkTop24Global && globalIndex > -1 && globalIndex < 24 && !isBatchRecorded(b);

            let highlights = b.courseHighlights || b.highlights || [];

            if (Array.isArray(highlights) && highlights.length > 0) {
                let displayHighlights = highlights.slice(0, 3); 
                highlightsHtml = '<ul class="card-highlights">';
                displayHighlights.forEach(h => {
                    let text = typeof h === 'object' ? (h.title || h.text || '') : h;
                    if(text) highlightsHtml += `<li><i class="fa-solid fa-check" style="color:#ff9933; margin-right:4px;"></i>${text}</li>`;

                if(highlights.length > 3) {

                 highlightsHtml = `<div class="card-highlights-text">${highlights}</div>`;
            } else if (b.description && typeof b.description === 'string') {
                 highlightsHtml = `<div class="card-highlights-text">${b.description}</div>`;
            }

            html += `
                <div class="batch-card">
                    <div class="banner-container">
                        <img src="${banner}" onerror="this.src='https://i.postimg.cc/7PF6SP6R/file-000000009290821187ff34aaef4ccaf2.png'">
                        ${showLiveBadge ? `<div class="live-badge-overlay"><div class="live-badge-dot"></div> LIVE</div>` : ''}

                    <div class="batch-card-body">
                        <div class="batch-card-title">${title}</div>
                        <div class="batch-card-sub">⚡ 𝐎𝐖𝐍𝐄𝐑 ➛ 𝐏𝐀ⲛDЕY 𝐉𝐈 UP⁴³</div>
                        ${metaTagsHtml}
                        ${highlightsHtml}
                        <div class="batch-footer">
                            <div class="price-tag">
                                ${priceDisplayHtml}
                            </div>
                            <div class="play-btn-card" onclick="openBatchView('${id}', '${title.replace(/'/g, "\\'")}', 'content')">
                                <i class="fa-solid fa-play"></i> Let's study
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        
        container.innerHTML = html;

        if (isHomeTab && query === '' && myCustomBanners.length > 0) {
            if (window.mySwiperInstance) {
                window.mySwiperInstance.destroy(true, true);
            }
            window.mySwiperInstance = new Swiper(".mySwiper", {
                loop: true,
                autoplay: {
                    delay: 4000,
                    disableOnInteraction: false,
                },
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
            });
        }
    }

    function closePlayer() {
        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) document.exitFullscreen();
        }
        document.getElementById('player-wrapper').style.display = 'none';
        document.getElementById('video-target').innerHTML = '';
        document.body.classList.remove('fullscreen-active');
    }

    function openPdfOnline(url, title) {
        closePlayer();
        document.getElementById('pdf-title').innerText = title + " (PDF)";
        document.getElementById('pdf-frame').src = "https://docs.google.com/viewer?url=" + encodeURIComponent(url) + "&embedded=true";
        document.getElementById('pdf-modal').style.display = 'flex';
    }

    async function downloadPdf(url, title, evt) {
        let btn = null;
        let origHtml = "";
        if (evt && evt.currentTarget) {
            btn = evt.currentTarget;
            origHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Downloading...`;
            btn.disabled = true;
        }
        try {
            let response = await fetch(url, { mode: 'cors' });
            if (!response.ok) throw new Error('CORS blocked');
            let blob = await response.blob();
            let blobUrl = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = (title || 'document') + '.pdf';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            }, 1000);
        } catch (err) {
            try {
                let a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) {
                window.open(url, '_blank');
            }
        } finally {
            if (btn) {
                btn.innerHTML = origHtml;
                btn.disabled = false;
            }
        }
    }

    function closePdf() {
        document.getElementById('pdf-modal').style.display = 'none';
        document.getElementById('pdf-frame').src = '';
    }

    function checkEmbeddedNotification() {
        if (embeddedPopupNotification && embeddedPopupNotification.trim() !== "") {

    function showNotificationPopup(msg) {
        let existing = document.getElementById('dynamic-notif-popup');
        if (existing) existing.remove();

        let div = document.createElement('div');
        div.id = 'dynamic-notif-popup';
        div.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.75); z-index: 9999999; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box;";
        div.innerHTML = `
            <div style="background: #ffffff; color: #333333; width: 100%; max-width: 500px; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative;">
                <div style="font-size: 18px; font-weight: bold; color: #ff9933; margin-bottom: 12px; text-align: center; border-bottom: 2px solid #ff9933; padding-bottom: 8px;">📢 Notification / Update</div>
                <div style="font-size: 13.5px; line-height: 1.6; margin-bottom: 15px; white-space: pre-line;">${esc(msg)}</div>
                <button onclick="this.closest('#dynamic-notif-popup').remove()" style="width: 100%; background: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px;">OK</button>
            </div>
        `;
        document.body.appendChild(div);
    }
